name: Update V2RaySE Nodes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 每6小时运行一次
    - cron: '0 */6 * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set TIME and DATE
        run: |
          NOW=$(TZ='Asia/Shanghai' date +%H%M)

          echo "Current Beijing Time: $NOW"

          # 08:00-19:59 -> 当天0800
          if [ "$NOW" -ge 800 ] && [ "$NOW" -le 1959 ]; then

            TIME="0800"
            DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)

          else

            TIME="2000"

            # 00:00-07:59 -> 前一天2000
            if [ "$NOW" -lt 800 ]; then
              DATE=$(TZ='Asia/Shanghai' date -d "yesterday" +%Y%m%d)
            else
              # 20:00-23:59 -> 当天2000
              DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
            fi

          fi

          VERSION="${DATE}${TIME}"

          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "DATE=$DATE" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "Selected VERSION=$VERSION"

      - name: Check Current Version
        id: check
        run: |
          if [ -f version.txt ]; then
            CURRENT_VERSION=$(cat version.txt)
          else
            CURRENT_VERSION="none"
          fi

          echo "Current Version: $CURRENT_VERSION"
          echo "Target Version: $VERSION"

          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "SKIP=true" >> $GITHUB_ENV
            echo "Already latest version"
          else
            echo "SKIP=false" >> $GITHUB_ENV
          fi

      - name: Download File
        if: env.SKIP != 'true'
        run: |
          URL="https://v2rayse.com/fs/public/${DATE}/free-node-share-${TIME}.txt"

          echo "Downloading:"
          echo "$URL"

          STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL")

          if [ "$STATUS" != "200" ]; then
            echo "File not found"
            exit 1
          fi

          curl -L \
            --retry 5 \
            --retry-delay 10 \
            --connect-timeout 20 \
            -o free-node-share.txt \
            "$URL"

          if [ ! -s free-node-share.txt ]; then
            echo "Download failed"
            exit 1
          fi

          echo "$VERSION" > version.txt

      - name: Commit and Push
        if: env.SKIP != 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add free-node-share.txt
          git add version.txt

          git commit -m "Update ${VERSION}"
          git push

      - name: Telegram Notification
        if: env.SKIP != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NOW=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          MESSAGE=$(printf "✅ V2RaySE节点更新成功\n\n节点版本：%s\n更新时间：%s\n\n下载链接：\nhttps://v2rayse.com/fs/public/%s/free-node-share-%s.txt" \
          "$VERSION" \
          "$NOW" \
          "$DATE" \
          "$TIME")

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"
