name: Update V2RaySE Nodes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 北京时间 08:37
    - cron: '37 0 * * *'

    # 北京时间 20:37
    - cron: '37 12 * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set TIME
        run: |
          NOW=$(TZ='Asia/Shanghai' date +%H%M)

          echo "Current Beijing Time: $NOW"

          # 0800-1959 下载0800
          # 2000-0759 下载2000
          if [ "$NOW" -ge 800 ] && [ "$NOW" -le 1959 ]; then
            echo "TIME=0800" >> $GITHUB_ENV
          else
            echo "TIME=2000" >> $GITHUB_ENV
          fi

      - name: Wait and Download
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)

          URL="https://v2rayse.com/fs/public/${DATE}/free-node-share-${TIME}.txt"

          FILE="free-node-share.txt"

          echo "Target URL:"
          echo "$URL"

          SUCCESS=0

          # 最多等待24次（约4小时）
          for i in $(seq 1 24); do

            echo "Check attempt $i..."

            STATUS=$(curl -L -s -o /dev/null -w "%{http_code}" "$URL")

            echo "HTTP Status: $STATUS"

            if [ "$STATUS" = "200" ]; then

              echo "File exists, downloading..."

              curl -L \
                --retry 5 \
                --retry-delay 10 \
                --connect-timeout 20 \
                -o "$FILE" \
                "$URL"

              # 检查文件是否有效
              if [ -s "$FILE" ]; then
                SUCCESS=1
                echo "Download success"
                break
              fi
            fi

            echo "File not ready, wait 10 minutes..."
            sleep 600

          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "File never appeared"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add free-node-share.txt

          git diff --cached --quiet || (
            git commit -m "Update ${TIME} nodes"
            git push
          )

      - name: Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          NOW=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")

          MESSAGE="✅ V2RaySE节点${TIME}已更新成功：${NOW}，下载链接：https://v2rayse.com/fs/public/$(TZ='Asia/Shanghai' date +%Y%m%d)/free-node-share-${TIME}.txt"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}"
