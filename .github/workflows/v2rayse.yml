name: Update V2RaySE Nodes

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    # 北京时间 08:30 -> UTC 0:30
    - cron: '30 0 * * *'
    # 北京时间 20:30 -> UTC 12:30
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  update-morning:
    if: github.event.schedule == '37 0 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download 0800
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          URL="https://v2rayse.com/fs/public/${DATE}/free-node-share-0800.txt"

          curl -L --retry 5 -o free-node-share.txt "$URL"

  update-evening:
    if: github.event.schedule == '37 12 * * *'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Download 2000
        run: |
          DATE=$(TZ='Asia/Shanghai' date +%Y%m%d)
          URL="https://v2rayse.com/fs/public/${DATE}/free-node-share-2000.txt"

          curl -L --retry 5 -o free-node-share.txt "$URL"

          SUCCESS=0
          for i in 1 2 3 4 5; do
            echo "Attempt $i ..."
            curl -L --connect-timeout 15 --retry 3 --retry-delay 5 -o "$FILE" "$URL"

            if [ -s "$FILE" ]; then
              SUCCESS=1
              echo "Download succeeded on attempt $i"
              break
            else
              echo "Download failed or empty, retrying ..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "All download attempts failed. Exiting."
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add free-node-share.txt
          git diff --cached --quiet || (
            git commit -m "Update node share"
            git push
          )

      - name: Telegram Notification
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date +"%Y-%m-%d %H:%M:%S")
          MESSAGE="✅ V2RaySE节点已更新成功：$DATE"

          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
